<!doctype html><html lang="tr"><head><meta charset="UTF-8"><title>Destek akış kontrolü</title></head><body><div id="root"></div>
<script type="module">
import React, { useState } from 'react'
import { createRoot } from 'react-dom/client'
import ThreadCenter from '../src/components/ThreadCenter.jsx'
import CustomerSupportWidget from '../src/components/CustomerSupportWidget.jsx'
import '../src/components/CustomerSupportWidget.css'
const args = new URLSearchParams(location.search)
const role = args.get('role') || 'customer'
const channel = args.get('channel') || 'support'
function Check() {
  const [open, setOpen] = useState(true)
  const [selectedChannel, setChannel] = useState(channel)
  if (role === 'customer') return React.createElement(CustomerSupportWidget, {
    token: 'test', user: { id: 7, role }, open, channel: selectedChannel,
    productId: channel === 'questions' ? 50 : null, onOpenChange: setOpen, onChannelChange: setChannel,
  })
  return React.createElement('section', { className: role === 'seller' ? 'seller-dashboard' : 'admin-dashboard' },
    React.createElement(ThreadCenter, { token: 'test', audience: role, channel, userId: role === 'seller' ? 9 : 2 }))
}
createRoot(document.getElementById('root')).render(React.createElement(Check))
</script></body></html>
